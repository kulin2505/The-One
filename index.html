<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The One Night Gathering (Mobile)</title>
    <style>
        /* 第一层：最底层固定黑色 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            overscroll-behavior: none;
        }

        /* 核心容器：保持比例并适配屏幕 */
        #stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 背景海报 - 核心调整：既要铺满，又要保持原本的舞台感 */
        #posterImage {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 改回 contain 确保海报不被裁剪，显示完整信息 */
            z-index: 1;
            pointer-events: none;
        }

        /* 烟花层级 */
        #fireworksCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>

    <script>
        // --- 1. 舞台适配逻辑 ---
        const stage = document.getElementById('stage');
        const canvas = document.getElementById('fireworksCanvas');
        const poster = document.getElementById('posterImage');
        const ctx = canvas.getContext('2d');
        
        let currentRect = { left: 0, top: 0, width: 0, height: 0 };

        function resizeStage() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            
            // 同步画布到窗口尺寸
            canvas.width = screenW;
            canvas.height = screenH;

            // 获取海报在 contain 模式下的实际显示尺寸和位置
            // 我们需要根据这个位置来让烟花在海报范围内生成
            const imgAspect = 1124 / 2436; // 原始比例
            const screenAspect = screenW / screenH;
            
            let actualW, actualH, left, top;
            if (screenAspect > imgAspect) {
                // 屏幕太宽，高度撑满，宽度留黑边
                actualH = screenH;
                actualW = screenH * imgAspect;
                left = (screenW - actualW) / 2;
                top = 0;
            } else {
                // 屏幕太长，宽度撑满，高度留黑边
                actualW = screenW;
                actualH = screenW / imgAspect;
                left = 0;
                top = (screenH - actualH) / 2;
            }
            currentRect = { left, top, width: actualW, height: actualH };
        }
        window.addEventListener('resize', resizeStage);
        resizeStage();


        // --- 2. 增强版烟花逻辑 ---
        let particles = [];
        
        // 霓虹配色池
        const colors = [
            '#FF00FF', // 紫红
            '#00FFFF', // 青色
            '#39FF14', // 荧光绿
            '#FFD700', // 金色
            '#FF3131', // 霓虹红
            '#1F51FF', // 霓虹蓝
            '#FE019A', // 热粉
            '#FFFFFF'  // 纯白闪烁
        ];

        // 形状列表
        const shapes = ['circle', 'star', 'ring', 'double'];

        class Particle {
            constructor(x, y, shapeType, specialColor = null) {
                this.x = x;
                this.y = y;
                this.color = specialColor || colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1;
                this.friction = 0.96; 
                this.gravity = 0.4;   
                this.size = Math.random() * 7 + 3; 
                this.decay = Math.random() * 0.015 + 0.01; 

                let angle, force;
                
                switch (shapeType) {
                    case 'star':
                        force = Math.random() * 20 + 5;
                        const angleBase = (Math.PI * 2) / 5;
                        angle = (Math.floor(Math.random() * 5) * angleBase) - (Math.PI / 2);
                        angle += (Math.random() * 0.6 - 0.3);
                        this.vx = Math.cos(angle) * force * 1.5;
                        this.vy = Math.sin(angle) * force * 1.5;
                        break;
                    case 'ring':
                        angle = Math.random() * Math.PI * 2;
                        force = 18 + Math.random() * 4; 
                        this.vx = Math.cos(angle) * force;
                        this.vy = Math.sin(angle) * force;
                        this.friction = 0.94; 
                        break;
                    case 'double_inner':
                        angle = Math.random() * Math.PI * 2;
                        force = Math.random() * 10 + 2;
                        this.vx = Math.cos(angle) * force;
                        this.vy = Math.sin(angle) * force;
                        break;
                    case 'circle':
                    default:
                        angle = Math.random() * Math.PI * 2;
                        force = Math.random() * 25 + 2;
                        this.vx = Math.cos(angle) * force;
                        this.vy = Math.sin(angle) * force;
                        break;
                }
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createFirework(x, y) {
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            let particleCount = 200;

            if (shape === 'double') {
                for (let i = 0; i < 150; i++) particles.push(new Particle(x, y, 'circle')); 
                for (let i = 0; i < 100; i++) particles.push(new Particle(x, y, 'double_inner', '#FFFFFF'));
            } else if (shape === 'ring') {
                particleCount = 250; 
                for (let i = 0; i < particleCount; i++) particles.push(new Particle(x, y, shape));
            } else {
                particleCount = 220;
                for (let i = 0; i < particleCount; i++) particles.push(new Particle(x, y, shape));
            }
        }

        function animate() {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.globalCompositeOperation = 'source-over';

            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animate);
        }
        animate();


        // --- 3. 交互逻辑 ---
        function handleInteraction(e) {
            e.preventDefault(); 
            const isTouch = e.type.includes('touch');
            const points = isTouch ? e.touches : [e];
            
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                // 关键修复：检查点击是否在海报的实际显示范围内
                if (p.clientX >= currentRect.left && p.clientX <= currentRect.left + currentRect.width &&
                    p.clientY >= currentRect.top && p.clientY <= currentRect.top + currentRect.height) {
                    createFirework(p.clientX, p.clientY);
                }
            }
        }

        window.addEventListener('mousedown', handleInteraction);
        window.addEventListener('touchstart', handleInteraction, {passive: false});

        window.onload = () => {
            document.getElementById('stage').style.opacity = 1;
        };

        window.addEventListener('mousedown', handleInteraction);
        window.addEventListener('touchstart', handleInteraction, {passive: false});

        // 确保图片加载后显示舞台
        window.onload = () => {
            document.getElementById('stage').style.opacity = 1;
        };

    </script>
</body>
