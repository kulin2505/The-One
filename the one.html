<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The One Night Gathering (Mobile)</title>
    <style>
        /* 第一层：最底层固定黑色 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        /* 核心容器：舞台 */
        /* 尺寸锁定为 1124x2436 */
        #stage {
            position: absolute; /* 改为绝对定位 */
            width: 1124px;
            height: 2436px;
            background-color: transparent;
            opacity: 0; 
            transition: opacity 0.5s ease;
            transform-origin: center center; /* 确保从中心缩放 */
        }

        /* 第二层：交互层 (Canvas) */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* 第三层：最上层图片 */
        #posterImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 20;
            pointer-events: none; /* 点击穿透 */
        }
    </style>
</head>
<body>

    <!-- 舞台容器 -->
    <div id="stage">
        <canvas id="fireworksCanvas" width="1124" height="2436"></canvas>
         <img id="posterImage" src="bg.png" alt="Invitation">
    </div>

    <script>
        // --- 1. 舞台适配逻辑 ---
        const stageWidth = 1124;
        const stageHeight = 2436;
        const stage = document.getElementById('stage');
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let currentScale = 1;

        function resizeStage() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            
            // 计算宽度和高度的缩放比例
            const scaleW = screenW / stageWidth;
            const scaleH = screenH / stageHeight;
            
            // 使用 Math.max 确保图片铺满全屏（Cover模式），消除黑边
            currentScale = Math.max(scaleW, scaleH);
            
            if (currentScale < 0.01) currentScale = 0.1; 
            
            stage.style.transform = `translate(-50%, -50%) scale(${currentScale})`;
            stage.style.left = "50%";
            stage.style.top = "50%";
            stage.style.opacity = 1;
        }
        window.addEventListener('resize', resizeStage);
        // resizeStage() moved to window.load


        // --- 2. 增强版烟花逻辑 (去掉了Heart) ---
        let particles = [];
        
        // 霓虹配色池
        const colors = [
            '#FF00FF', // 紫红
            '#00FFFF', // 青色
            '#39FF14', // 荧光绿
            '#FFD700', // 金色
            '#FF3131', // 霓虹红
            '#1F51FF', // 霓虹蓝
            '#FE019A', // 热粉
            '#FFFFFF'  // 纯白闪烁
        ];

        let textParticles = [];
        const mouse = { x: null, y: null, radius: 100 };

        class TextParticle {
            constructor(x, y, color) {
                this.x = Math.random() * stageWidth;
                this.y = Math.random() * stageHeight;
                this.baseX = x;
                this.baseY = y;
                this.color = color;
                this.size = 3.5;
                this.density = (Math.random() * 30) + 10;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    let force = (mouse.radius - distance) / mouse.radius;
                    let directionX = (dx / distance) * force * this.density;
                    let directionY = (dy / distance) * force * this.density;
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    this.x += (this.baseX - this.x) * 0.1;
                    this.y += (this.baseY - this.y) * 0.1;
                }
            }
        }

        // 形状列表 (已移除 heart)
        const shapes = ['circle', 'star', 'ring', 'double'];

        class FireworkParticle {
            constructor(x, y, shapeType, specialColor = null) {
                this.x = x;
                this.y = y;
                this.color = specialColor || colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1;
                this.friction = 0.96; 
                this.gravity = 0.4;   
                this.size = Math.random() * 7 + 3; 
                this.decay = Math.random() * 0.015 + 0.01; 

                let angle, force;
                
                switch (shapeType) {
                    case 'star':
                        // 五角星
                        force = Math.random() * 20 + 5;
                        const angleBase = (Math.PI * 2) / 5;
                        angle = (Math.floor(Math.random() * 5) * angleBase) - (Math.PI / 2);
                        angle += (Math.random() * 0.6 - 0.3); // 抖动范围
                        
                        this.vx = Math.cos(angle) * force * 1.5;
                        this.vy = Math.sin(angle) * force * 1.5;
                        break;

                    case 'ring':
                        // 光环
                        angle = Math.random() * Math.PI * 2;
                        force = 18 + Math.random() * 4; 
                        this.vx = Math.cos(angle) * force;
                        this.vy = Math.sin(angle) * force;
                        this.friction = 0.94; 
                        break;
                    
                    case 'double_inner':
                         // 双层爆炸的内圈
                        angle = Math.random() * Math.PI * 2;
                        force = Math.random() * 10 + 2;
                        this.vx = Math.cos(angle) * force;
                        this.vy = Math.sin(angle) * force;
                        break;

                    case 'circle':
                    default:
                        // 经典圆形
                        angle = Math.random() * Math.PI * 2;
                        force = Math.random() * 25 + 2;
                        this.vx = Math.cos(angle) * force;
                        this.vy = Math.sin(angle) * force;
                        break;
                }
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createFirework(x, y) {
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            let particleCount = 200;

            if (shape === 'double') {
                // 外层
                for (let i = 0; i < 150; i++) {
                    particles.push(new FireworkParticle(x, y, 'circle')); 
                }
                // 内层
                const innerColor = '#FFFFFF';
                for (let i = 0; i < 100; i++) {
                    particles.push(new FireworkParticle(x, y, 'double_inner', innerColor));
                }
            } else if (shape === 'ring') {
                particleCount = 250; 
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new FireworkParticle(x, y, shape));
                }
            } else {
                particleCount = 220;
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new FireworkParticle(x, y, shape));
                }
            }
        }

        function initTextParticles() {
            textParticles = [];
            ctx.fillStyle = 'white';
            const fontSize = 120;
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const text = "THE ONE";
            ctx.fillText(text, stageWidth / 2, stageHeight / 2 - 100);
            
            const imageData = ctx.getImageData(0, 0, stageWidth, stageHeight);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const gap = 8;
            for (let y = 0; y < imageData.height; y += gap) {
                for (let x = 0; x < imageData.width; x += gap) {
                    if (imageData.data[(y * 4 * imageData.width) + (x * 4) + 3] > 128) {
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        textParticles.push(new TextParticle(x, y, color));
                    }
                }
            }
        }
        window.addEventListener('load', () => {
            console.log("Stage Initializing...");
            resizeStage();
            animate();
            stage.style.opacity = 1;
        });

        function animate() {
            // 拖尾
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 烟花粒子
            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }
        // animate() moved to window.load


        // --- 3. 交互逻辑 ---
        function getRelativeCoordinates(event) {
            const rect = stage.getBoundingClientRect();
            const clientX = event.clientX;
            const clientY = event.clientY;
            const x = (clientX - rect.left) / currentScale;
            const y = (clientY - rect.top) / currentScale;
            return { x, y };
        }

        function handleInteraction(e) {
            let coords;
            if (e.type.includes('touch')) {
                if (!e.touches || e.touches.length === 0) return;
                const touch = e.touches[0];
                const mockEvent = { clientX: touch.clientX, clientY: touch.clientY };
                coords = getRelativeCoordinates(mockEvent);
            } else {
                coords = getRelativeCoordinates(e);
            }

            if(coords && coords.x >= 0 && coords.x <= stageWidth && coords.y >= 0 && coords.y <= stageHeight) {
                mouse.x = coords.x;
                mouse.y = coords.y;
                createFirework(coords.x, coords.y);
            }
        }
        
        // 增加鼠标移动监听，以便点点字体在非点击时也能互动
        window.addEventListener('mousemove', (e) => {
            const coords = getRelativeCoordinates(e);
            mouse.x = coords.x;
            mouse.y = coords.y;
        });

        window.addEventListener('mousedown', handleInteraction);
        window.addEventListener('touchstart', handleInteraction, {passive: false});

    </script>
</body>
</html>
